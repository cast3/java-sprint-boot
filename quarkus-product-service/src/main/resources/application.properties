# ==============================================================================
# Configuración de Quarkus — Microservicio de Productos
# ==============================================================================

# Nombre de la aplicación
quarkus.application.name=quarkus-product-service

# Puerto del servidor (8081 para no conflictar con Spring Boot en 8080)
quarkus.http.port=8081

# ==============================================================================
# Base de datos — Perfil DEV (H2 en memoria)
# ==============================================================================
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true

# ==============================================================================
# Base de datos — Perfil TEST (H2 en memoria, separado del dev)
# ==============================================================================
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.log.sql=false

# ==============================================================================
# Base de datos — Perfil PROD (PostgreSQL vía Docker, variables de entorno)
# ==============================================================================
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:productdb}
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASSWORD:postgres}
%prod.quarkus.hibernate-orm.database.generation=validate
%prod.quarkus.hibernate-orm.log.sql=false

# ==============================================================================
# OpenAPI / Swagger UI
# ==============================================================================
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui.html
quarkus.smallrye-openapi.path=/api-docs
mp.openapi.extensions.smallrye.info.title=Quarkus Product Service API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Microservicio de productos con Arquitectura Limpia y Quarkus

# ==============================================================================
# Health checks
# ==============================================================================
quarkus.smallrye-health.ui.always-include=true

# ==============================================================================
# Logging
# ==============================================================================
quarkus.log.console.enable=true
quarkus.log.level=INFO
quarkus.log.category."com.example".level=DEBUG
